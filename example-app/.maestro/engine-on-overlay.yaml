appId: com.example.plugin
---
- launchApp
- tapOn: 'Create (engine on)'
- assertVisible:
    text: 'engine-on:state='
- tapOn: 'Toggle web overlay'
- assertVisible:
    id: 'engine-web-overlay'
- assertVisible:
    text: 'overlay-open:state='
- tapOn: 'Web overlay (tap to dismiss)'
- assertVisible:
    text: 'overlay-dismissed:state='